<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natural Wine Importers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  /* styled like a hand-labelled bottle tag / shipping manifest */
  :root { --ink: #2a2a28; --paper: #f4efe4; --card: #fffdf8; --yellow: #f2d64b; --peach: #ef9f7c; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
    background: var(--paper); color: var(--ink); font: 400 14px/1.7 "IBM Plex Mono", ui-monospace, monospace;
  }
  .card {
    background: var(--card); width: min(560px, 100%); padding: 40px 40px 28px;
    border: 1.5px solid var(--ink); box-shadow: 6px 6px 0 var(--yellow);
  }
  .top { display: flex; justify-content: space-between; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px dashed var(--ink); padding-bottom: 10px; }
  .logo { display: block; width: 200px; margin: 24px auto 8px; }
  h1 { text-align: center; font-size: 1.35rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
  .hand { text-align: center; font: 500 1.75rem/1.2 Caveat, cursive; color: #b4532f; margin: 6px 0 22px; transform: rotate(-1.5deg); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; border-top: 1px dashed var(--ink); border-bottom: 1px dashed var(--ink); padding: 14px 0; }
  dt { text-transform: uppercase; font-size: .7rem; letter-spacing: .1em; padding-top: 2px; opacity: .6; }
  dd a { color: var(--ink); text-decoration-color: var(--peach); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  footer { margin-top: 14px; font-size: .7rem; opacity: .55; text-align: center; }
  @media (max-width: 520px) {
    .card { padding: 28px 22px 22px; }
    .top span:last-child { display: none; }
    .top { justify-content: center; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="top"><span>Natural Wine Importers Inc.</span><span>Est. West Coast</span></div>
  <img class="logo" src="logo.png" alt="Watercolor drawing of a wine bottle above a bunch of grapes">
  <h1>Natural Wine Importers</h1>
  <p class="hand">fermented grape juice for the left side of the USA</p>
  <dl>
    <dt>Status</dt><dd>Out sourcing wine. Back soon.</dd>
    <dt>Contents</dt><dd>Grapes. That's it.</dd>
    <dt>Follow</dt><dd><a href="https://www.instagram.com/naturalwineimporters/">@naturalwineimporters</a></dd>
  </dl>
  <footer>© 2026 Natural Wine Importers Inc.</footer>
</div>
</body>
</html>
