<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natural Wine Importers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --wine: #5a1f2b; --cream: #f7efe1; --yellow: #f2d64b; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr;
    font: 400 16px/1.6 "DM Sans", system-ui, sans-serif; color: var(--cream); background: var(--wine);
  }
  .left { background: #fff; display: grid; place-items: center; padding: 6vw; }
  .left img { width: min(440px, 80%); }
  .right { display: flex; flex-direction: column; justify-content: space-between; padding: 6vw 6vw 32px; }
  .eyebrow { font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--yellow); }
  h1 { font: 400 clamp(2.5rem, 5.5vw, 4.5rem)/1 "DM Serif Display", serif; margin-top: 1rem; }
  .tagline { font: italic 400 clamp(1.2rem, 2.2vw, 1.6rem)/1.35 "DM Serif Display", serif; margin-top: 1.5rem; opacity: .9; max-width: 22ch; }
  p.note { margin-top: 2.5rem; max-width: 38ch; opacity: .75; }
  a.ig {
    display: inline-block; margin-top: 1.5rem; padding: .8rem 1.4rem; border-radius: 999px;
    background: var(--yellow); color: var(--wine); text-decoration: none; font-weight: 500;
  }
  a.ig:hover { background: var(--cream); }
  footer { font-size: .75rem; opacity: .55; margin-top: 3rem; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    .left { padding: 40px 24px; } .left img { width: 55vw; }
    .right { padding: 40px 24px 24px; }
  }
</style>
</head>
<body>
<div class="left"><img src="logo.png" alt="Watercolor drawing of a wine bottle above a bunch of grapes"></div>
<div class="right">
  <div>
    <p class="eyebrow">Coming soon</p>
    <h1>Natural Wine Importers</h1>
    <p class="tagline">Bringing fermented grape juice to the left side of the USA.</p>
    <p class="note">We're out sourcing wine right now. Follow what we're drinking in the meantime.</p>
    <a class="ig" href="https://www.instagram.com/naturalwineimporters/">Follow on Instagram</a>
  </div>
  <footer>© 2026 Natural Wine Importers Inc.</footer>
</div>
</body>
</html>
