<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natural Wine Importers</title>
<meta name="description" content="Bringing fermented grape juice to the left side of the USA. We're out sourcing wine. Follow what we're drinking on Instagram.">
<link rel="canonical" href="https://naturalwineimporters.com/">
<meta name="theme-color" content="#fbf6ec">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Natural Wine Importers">
<meta property="og:title" content="Natural Wine Importers">
<meta property="og:description" content="Bringing fermented grape juice to the left side of the USA.">
<meta property="og:url" content="https://naturalwineimporters.com/">
<meta property="og:image" content="https://naturalwineimporters.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="preload" href="/fonts/fraunces-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/fraunces-300-italic.woff2" as="font" type="font/woff2" crossorigin>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Natural Wine Importers Inc.",
  "url": "https://naturalwineimporters.com/",
  "logo": "https://naturalwineimporters.com/logo.png",
  "sameAs": ["https://www.instagram.com/naturalwineimporters/"]
}
</script>

<style>
  @font-face { font-family: Fraunces; font-style: normal; font-weight: 300; font-display: swap; src: url(/fonts/fraunces-300.woff2) format("woff2"); }
  @font-face { font-family: Fraunces; font-style: italic; font-weight: 300; font-display: swap; src: url(/fonts/fraunces-300-italic.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-style: normal; font-weight: 400 500; font-display: swap; src: url(/fonts/inter-var.woff2) format("woff2"); }

  :root { --ink: #2b2620; --muted: #74695c; --bg: #fbf6ec; --yellow: #f2d64b; --peach: #f3c9a6; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); min-height: 100vh; min-height: 100dvh;
    font: 400 16px/1.6 Inter, system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  header { padding: 28px 6vw; font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; }
  main {
    display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 4vw;
    padding: 0 6vw; max-width: 1200px; margin: 0 auto; width: 100%;
  }
  h1 {
    font: 300 clamp(2.4rem, 6vw, 4.75rem)/1.02 Fraunces, Georgia, serif; letter-spacing: -.015em;
  }
  h1 em { font-style: italic; position: relative; z-index: 0; white-space: nowrap; }
  /* watercolor-ish swash under the key phrase */
  h1 em::after {
    content: ""; position: absolute; left: -4%; right: -4%; bottom: .08em; height: .42em; z-index: -1;
    background: var(--yellow); opacity: .75; border-radius: 40% 60% 55% 45% / 60% 40% 60% 40%;
    filter: blur(.5px);
  }
  p.note { color: var(--muted); max-width: 40ch; margin-top: 1.75rem; font-size: 1.05rem; }
  a.ig {
    display: inline-flex; align-items: center; gap: .6rem; margin-top: 2rem;
    color: var(--ink); text-decoration: none; font-weight: 500;
    border-bottom: 2px solid var(--peach); padding-bottom: 2px; transition: border-color .2s;
  }
  a.ig:hover, a.ig:focus-visible { border-color: var(--yellow); }
  a.ig:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .art { position: relative; justify-self: center; }
  .art::before {
    content: ""; position: absolute; inset: 12% 6% 4% 10%; z-index: -1;
    background: radial-gradient(closest-side, var(--peach), transparent); opacity: .55;
  }
  .art img { width: min(420px, 38vw); height: auto; display: block; }
  footer { padding: 28px 6vw; font-size: .75rem; color: var(--muted); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; text-align: center; padding-top: 2vh; }
    .art { order: -1; } .art img { width: 62vw; }
    p.note { margin-inline: auto; }
    header, footer { text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>Natural Wine Importers</header>
<main>
  <div>
    <h1>Bringing fermented grape juice to the <em>left side</em> of the USA.</h1>
    <p class="note">We're currently out sourcing wine. In the meantime, follow what we're drinking on Instagram.</p>
    <a class="ig" href="https://www.instagram.com/naturalwineimporters/" rel="me">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg>
      @naturalwineimporters
    </a>
  </div>
  <div class="art"><img src="/logo.png" width="296" height="296" alt="Watercolor drawing of a wine bottle above a bunch of grapes"></div>
</main>
<footer>© 2026 Natural Wine Importers Inc.</footer>
</body>
</html>
